# 1. Gradle Daemon Memory & Parallel Garbage Collection (drastically cuts GC pauses)
org.gradle.jvmargs=-Xmx3584m -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 2. Build Cache & Multi-threaded Parallel Execution
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# 3. KSP & Kotlin Incremental Compilation (only compile changed files, not entire app)
ksp.incremental=true
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# 4. Android Build Speed Enhancements
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
