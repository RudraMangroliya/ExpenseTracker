name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/MR-Tracker-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/MR-Tracker.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/MR-Tracker-${{ github.ref_name }}.apk
            release-assets/MR-Tracker.apk
          name: MR Tracker ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### 🚀 MR Tracker - Official Android Release

            Welcome to the official release of **MR Tracker**!

            #### ✨ Key Features:
            - 💱 **Live Currency Converter**: Real-time European Central Bank rates with offline caching
            - 🎨 **Modern Liquid Glass UI**: 120 FPS buttery-smooth transitions & custom Floating Dock Bar
            - 🔍 **Smart Filters & Search**: Instant lookup across notes, categories, and split bills
            - 👥 **Split Bills**: Track group expenses and share instant reminder summaries
            - 📊 **Budgets & Insights**: Real-time spending progress bars, monthly limits, and breakdown charts
            - 🌗 **Adaptive Themes & Haptics**: Full Dark / Light mode with tactile haptic feedback

            #### 📲 Installation:
            1. Download the **MR-Tracker-${{ github.ref_name }}.apk** below directly on your Android phone.
            2. Tap the downloaded file to install.
